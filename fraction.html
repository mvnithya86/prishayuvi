<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 5: Fractions — Set 1 (30 Questions)</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #cfe8f7; text-align: center; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 15px; max-width: 550px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .clue-text { font-size: 18px; color: #555; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .target-word { font-size: 20px; font-weight: bold; color: #2c3e50; background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.5; }
    button { display: block; width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: none; background: #fff4b3; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ffeaa7; }
    #score { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    #result { font-size: 24px; font-weight: bold; color: #27ae60; margin-top: 20px; }
  </style>
</head>
<body>

<h2>➗ Chapter 5: Fractions — Set 1 (30 Questions)</h2>
<div id="score">Score: 0 / 30</div>
<div class="box" id="quiz"></div>
<div id="result"></div>

<script>
let questions = [
  {q: "Add: 7/15 + 4/15", options: ["11/15", "11/30", "3/15"], answer: 0},
  {q: "Add: 5/9 + 2/9", options: ["7/9", "7/18", "3/9"], answer: 0},
  {q: "Add: 3/8 + 5/6", options: ["1 5/24", "8/14", "1 1/12"], answer: 0},
  {q: "Add: 1/6 + 2/5", options: ["17/30", "3/11", "1/2"], answer: 0},
  {q: "Add: 2 1/4 + 3 2/5", options: ["5 13/20", "5 3/9", "6 3/20"], answer: 0},
  {q: "Add: 1 3/5 + 2 3/4", options: ["4 7/20", "3 6/9", "4 1/20"], answer: 0},
  {q: "Subtract: 11/18 − 5/18", options: ["1/3", "6/36", "1/2"], answer: 0},
  {q: "Subtract: 8/13 − 3/13", options: ["5/13", "5/26", "11/13"], answer: 0},
  {q: "Subtract: 5/6 − 3/8", options: ["11/24", "2/2", "1/4"], answer: 0},
  {q: "Subtract: 2/3 − 1/4", options: ["5/12", "1/1", "1/7"], answer: 0},
  {q: "Subtract: 4 1/3 − 2 3/4", options: ["1 7/12", "2 2/1", "1 5/12"], answer: 0},
  {q: "Subtract: 3 3/8 − 1 1/6", options: ["2 5/24", "2 2/2", "2 1/8"], answer: 0},
  {q: "Multiply: 7/12 × 9/14", options: ["3/8", "63/168", "1/2"], answer: 0},
  {q: "Multiply: 5/8 × 4/15", options: ["1/6", "20/120", "9/23"], answer: 0},
  {q: "Multiply: 4/9 × 63", options: ["28", "36", "24"], answer: 0},
  {q: "Multiply: 3/11 × 55", options: ["15", "165", "12"], answer: 0},
  {q: "Multiply: 3 1/5 × 2 3/8", options: ["7 3/5", "6 3/40", "7 1/5"], answer: 0},
  {q: "Multiply: 2 2/3 × 1 1/2", options: ["4", "2 1/3", "3 1/2"], answer: 0},
  {q: "Divide: 8/15 ÷ 4/5", options: ["2/3", "32/75", "3/2"], answer: 0},
  {q: "Divide: 6/13 ÷ 2/13", options: ["3", "12/169", "1/3"], answer: 0},
  {q: "Divide: 12/17 ÷ 6", options: ["2/17", "72/17", "1/17"], answer: 0},
  {q: "Divide: 9/11 ÷ 7", options: ["9/77", "63/11", "7/99"], answer: 0},
  {q: "Divide: 6 2/3 ÷ 2 2/9", options: ["3", "2 1/2", "4"], answer: 0},
  {q: "Divide: 5 1/3 ÷ 3 5/9", options: ["1 1/2", "1 1/3", "1 2/5"], answer: 0},
  {q: "What should be added to 13/35 to get 11/7?", options: ["6/5", "42/35", "24/42"], answer: 0},
  {q: "What should be multiplied to 3 7/9 to get 2 2/7?", options: ["27/44", "44/27", "9/17"], answer: 0},
  {q: "Simplify: 3/4 + 1/2 of 4/5 − 1/5", options: ["19/20", "17/20", "1 1/20"], answer: 0},
  {q: "Simplify: 2/3 of 9/10 + 1/4 ÷ 1/2", options: ["1 1/10", "18/30", "4/5"], answer: 0},
  {q: "Simplify: 4 1/2 − [ 2 1/4 + { 1 1/2 − ( 3/4 − 1/2 ) } ]", options: ["1", "1 1/2", "3/4"], answer: 0},
  {q: "Simplify: 3 1/3 ÷ [ 1 2/3 + { 2 1/2 − ( 1 1/4 + 1/6 ) } ]", options: ["1 1/9", "1 2/5", "5/6"], answer: 0}
];

let current = 0, score = 0, currentShuffledOptions = [], correctTextForCurrentQuestion = "";
let clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let correctSound = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");
let wrongSound = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerHTML = "🎉 Quiz Completed! Final Score: " + score + " / " + questions.length;
    return;
  }
  let q = questions[current];
  correctTextForCurrentQuestion = q.options[q.answer];
  currentShuffledOptions = shuffle([...q.options]);

  let html = `<div class="clue-text">Question ${current + 1} of ${questions.length}:</div><div class="target-word">${q.q}</div>`;
  currentShuffledOptions.forEach((opt, index) => { html += `<button onclick="check(${index})">${opt}</button>`; });
  document.getElementById("quiz").innerHTML = html;
}

function check(selectedIndex) {
  clickSound.play().catch(e => {});
  let selectedText = currentShuffledOptions[selectedIndex];
  let buttons = document.querySelectorAll("#quiz button");

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (currentShuffledOptions[idx] === correctTextForCurrentQuestion) btn.style.background = "#a8e6a3";
    if (idx === selectedIndex && selectedText !== correctTextForCurrentQuestion) btn.style.background = "#ffb3b3";
  });

  if (selectedText === correctTextForCurrentQuestion) { score++; correctSound.play().catch(e => {}); }
  else { wrongSound.play().catch(e => {}); }

  document.getElementById("score").innerText = "Score: " + score + " / " + questions.length;
  setTimeout(() => { current++; loadQuestion(); }, 1500);
}
loadQuestion();
</script>
</body>
</html>
