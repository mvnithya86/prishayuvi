<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set 1: Lines, Rays & Angle Basics</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #cfe8f7; text-align: center; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 15px; max-width: 550px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .clue-text { font-size: 18px; color: #555; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .target-word { font-size: 20px; font-weight: bold; color: #2c3e50; background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.5; }
    button { display: block; width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: none; background: #fff4b3; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ffeaa7; }
    #score { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    #result { font-size: 24px; font-weight: bold; color: #27ae60; margin-top: 20px; }
  </style>
</head>
<body>

<h2>📐 Set 1: Lines, Rays & Basic Concepts</h2>
<div id="score">Score: 0</div>
<div class="box" id="quiz"></div>
<div id="result"></div>

<script>
let questions = [
  {q: "How many endpoints does a line segment have?", options: ["2", "1", "0"], answer: 0},
  {q: "How many endpoints does a ray have?", options: ["1", "2", "0"], answer: 0},
  {q: "How many endpoints does a line have?", options: ["0", "1", "2"], answer: 0},
  {q: "Two lines in the same plane that never meet are called:", options: ["Parallel lines", "Intersecting lines", "Perpendicular lines"], answer: 0},
  {q: "When two lines cross each other at a single point, they are:", options: ["Intersecting lines", "Parallel lines", "Concurrent lines"], answer: 0},
  {q: "If three or more lines pass through the exact same point, they are called:", options: ["Concurrent lines", "Collinear lines", "Parallel lines"], answer: 0},
  {q: "Points that lie on the same straight line are called:", options: ["Collinear points", "Concurrent points", "Intersecting points"], answer: 0},
  {q: "What is the measure of a right angle?", options: ["90°", "180°", "360°"], answer: 0},
  {q: "An angle whose measure is less than 90° is called:", options: ["Acute angle", "Obtuse angle", "Reflex angle"], answer: 0},
  {q: "An angle greater than 90° but less than 180° is called:", options: ["Obtuse angle", "Acute angle", "Straight angle"], answer: 0},
  {q: "What is the measure of a straight angle?", options: ["180°", "90°", "360°"], answer: 0},
  {q: "An angle greater than 180° but less than 360° is called:", options: ["Reflex angle", "Obtuse angle", "Complete angle"], answer: 0},
  {q: "What is the measure of a complete angle?", options: ["360°", "180°", "90°"], answer: 0},
  {q: "Which instrument in a geometry box is used to measure angles?", options: ["Protractor", "Compass", "Divider"], answer: 0},
  {q: "Which instrument is primarily used to draw circles and arcs?", options: ["Compass", "Protractor", "Set square"], answer: 0},
  {q: "How many lines can pass through a single given point?", options: ["Infinitely many", "Only one", "Only two"], answer: 0},
  {q: "How many straight lines can pass through two distinct points?", options: ["Exactly one", "Two", "Infinitely many"], answer: 0},
  {q: "Convert 6.5 cm into millimetres.", options: ["65 mm", "650 mm", "0.65 mm"], answer: 0},
  {q: "Convert 450 cm into metres.", options: ["4.5 m", "45 m", "0.45 m"], answer: 0},
  {q: "When two intersecting lines meet at 90°, they are:", options: ["Perpendicular lines", "Parallel lines", "Skew lines"], answer: 0},
  {q: "How many line segments form a simple triangle?", options: ["3", "4", "2"], answer: 0},
  {q: "What is the maximum number of intersection points for 2 straight lines?", options: ["1", "2", "Infinite"], answer: 0},
  {q: "A light beam from a flashlight is a real-world example of a:", options: ["Ray", "Line segment", "Line"], answer: 0},
  {q: "An edge of a ruler represents a:", options: ["Line segment", "Ray", "Point"], answer: 0},
  {q: "A tiny dot made by a sharp pencil tip represents a:", options: ["Point", "Line", "Ray"], answer: 0}
];

let current = 0, score = 0, currentShuffledOptions = [], correctTextForCurrentQuestion = "";
let clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let correctSound = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");
let wrongSound = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerHTML = "🎉 Quiz Completed! Final Score: " + score + " / " + questions.length;
    return;
  }
  let q = questions[current];
  correctTextForCurrentQuestion = q.options[q.answer];
  currentShuffledOptions = shuffle([...q.options]);

  let html = `<div class="clue-text">Question ${current + 1} of ${questions.length}:</div><div class="target-word">${q.q}</div>`;
  currentShuffledOptions.forEach((opt, index) => { html += `<button onclick="check(${index})">${opt}</button>`; });
  document.getElementById("quiz").innerHTML = html;
}

function check(selectedIndex) {
  clickSound.play().catch(e => {});
  let selectedText = currentShuffledOptions[selectedIndex];
  let buttons = document.querySelectorAll("#quiz button");

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (currentShuffledOptions[idx] === correctTextForCurrentQuestion) btn.style.background = "#a8e6a3";
    if (idx === selectedIndex && selectedText !== correctTextForCurrentQuestion) btn.style.background = "#ffb3b3";
  });

  if (selectedText === correctTextForCurrentQuestion) { score++; correctSound.play().catch(e => {}); }
  else { wrongSound.play().catch(e => {}); }

  document.getElementById("score").innerText = "Score: " + score + " / " + questions.length;
  setTimeout(() => { current++; loadQuestion(); }, 1500);
}
loadQuestion();
</script>
</body>
</html>
