<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertically Opposite Angles - Practice Quiz</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #cfe8f7; text-align: center; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 15px; max-width: 550px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .clue-text { font-size: 18px; color: #555; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .target-word { font-size: 18px; font-weight: bold; color: #2c3e50; background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.5; }
    button { display: block; width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: none; background: #fff4b3; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ffeaa7; }
    #score { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    #result { font-size: 24px; font-weight: bold; color: #27ae60; margin-top: 20px; }
    svg { background: #ffffff; border-radius: 8px; margin: 10px auto; display: block; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>

<h2>📐 Vertically Opposite Angles & Intersecting Lines</h2>
<div id="score">Score: 0</div>
<div class="box" id="quiz"></div>
<div id="result"></div>

<script>
// Helper function to generate standardized SVG diagrams for intersecting lines AB and CD
function getDiagram(top, right, bottom, left) {
  return `<svg width='220' height='140' viewBox='0 0 220 140'>
    <line x1='30' y1='110' x2='190' y2='30' stroke='#1e293b' stroke-width='3'/>
    <line x1='30' y1='30' x2='190' y2='110' stroke='#1e293b' stroke-width='3'/>
    <text x='15' y='125' font-size='13' font-weight='bold' fill='#475569'>A</text>
    <text x='195' y='25' font-size='13' font-weight='bold' fill='#475569'>B</text>
    <text x='15' y='25' font-size='13' font-weight='bold' fill='#475569'>C</text>
    <text x='195' y='125' font-size='13' font-weight='bold' fill='#475569'>D</text>
    <text x='110' y='42' font-size='15' font-weight='bold' fill='#d97706' text-anchor='middle'>${top}</text>
    <text x='155' y='75' font-size='15' font-weight='bold' fill='#2563eb' text-anchor='middle'>${right}</text>
    <text x='110' y='108' font-size='15' font-weight='bold' fill='#d97706' text-anchor='middle'>${bottom}</text>
    <text x='65' y='75' font-size='15' font-weight='bold' fill='#2563eb' text-anchor='middle'>${left}</text>
  </svg>`;
}

let questions = [
  // --- WORKSHEET DIRECT PROBLEMS (1-6) ---
  {q: getDiagram("x", "y", "z", "65°") + "AB and CD are straight lines. Find ∠y.", options: ["65°", "115°", "180°"], answer: 0},
  {q: getDiagram("x", "y", "z", "70°") + "AB and CD are straight lines. Find ∠z.", options: ["110°", "70°", "120°"], answer: 0},
  {q: getDiagram("y", "z", "155°", "x") + "AB and CD are straight lines. Find ∠z.", options: ["25°", "155°", "35°"], answer: 0},
  {q: getDiagram("125°", "x", "y", "z") + "AB and CD are straight lines. Find ∠y.", options: ["125°", "55°", "65°"], answer: 0},
  {q: getDiagram("y", "z", "100°", "x") + "AB and CD are straight lines. Find ∠z.", options: ["80°", "100°", "90°"], answer: 0},
  {q: getDiagram("z", "160°", "x", "y") + "AB and CD are straight lines. Find ∠z.", options: ["20°", "160°", "30°"], answer: 0},

  // --- VERTICALLY OPPOSITE EQUALITY (7-12) ---
  {q: getDiagram("x", "y", "z", "40°") + "AB and CD are straight lines. Find ∠y.", options: ["40°", "140°", "50°"], answer: 0},
  {q: getDiagram("130°", "x", "y", "z") + "AB and CD are straight lines. Find ∠y.", options: ["130°", "50°", "100°"], answer: 0},
  {q: getDiagram("x", "y", "z", "82°") + "AB and CD are straight lines. Find ∠y.", options: ["82°", "98°", "102°"], answer: 0},
  {q: getDiagram("z", "115°", "y", "x") + "AB and CD are straight lines. Find ∠x.", options: ["115°", "65°", "75°"], answer: 0},
  {q: getDiagram("x", "y", "45°", "z") + "AB and CD are straight lines. Find ∠x.", options: ["45°", "135°", "55°"], answer: 0},
  {q: getDiagram("148°", "z", "y", "x") + "AB and CD are straight lines. Find ∠y.", options: ["148°", "32°", "42°"], answer: 0},

  // --- LINEAR PAIRS ON INTERSECTING LINES (13-18) ---
  {q: getDiagram("x", "y", "z", "50°") + "AB and CD are straight lines. Find ∠z.", options: ["130°", "50°", "140°"], answer: 0},
  {q: getDiagram("z", "135°", "y", "x") + "AB and CD are straight lines. Find ∠z.", options: ["45°", "135°", "55°"], answer: 0},
  {q: getDiagram("75°", "y", "z", "x") + "AB and CD are straight lines. Find ∠x.", options: ["105°", "75°", "115°"], answer: 0},
  {q: getDiagram("x", "z", "120°", "y") + "AB and CD are straight lines. Find ∠z.", options: ["60°", "120°", "70°"], answer: 0},
  {q: getDiagram("x", "y", "z", "35°") + "AB and CD are straight lines. Find ∠x.", options: ["145°", "35°", "155°"], answer: 0},
  {q: getDiagram("x", "150°", "z", "y") + "AB and CD are straight lines. Find ∠z.", options: ["30°", "150°", "40°"], answer: 0},

  // --- ALGEBRAIC & MULTI-STEP PROBLEMS (19-22) ---
  {q: getDiagram("(2x + 10)°", "y", "70°", "z") + "Vertically opposite angles are (2x + 10)° and 70°. Find x.", options: ["30", "35", "40"], answer: 0},
  {q: getDiagram("(3x - 15)°", "y", "105°", "z") + "Vertically opposite angles are (3x - 15)° and 105°. Find x.", options: ["40", "30", "45"], answer: 0},
  {q: getDiagram("(x + 40)°", "y", "z", "x°") + "Adjacent angles on straight line CD are x° and (x + 40)°. Find x.", options: ["70", "80", "60"], answer: 0},
  {q: getDiagram("3x", "y", "z", "1x") + "Two adjacent angles on line CD are in the ratio 1 : 3. Find the smaller angle.", options: ["45°", "135°", "30°"], answer: 0},

  // --- CONCEPTUAL & ANGLE SUM RULES (23-25) ---
  {q: getDiagram("x", "y", "z", "w") + "Two straight lines AB and CD intersect at point O. What is the sum of all four angles (x + y + z + w)?", options: ["360°", "180°", "270°"], answer: 0},
  {q: getDiagram("90°", "y", "z", "x") + "Lines AB and CD intersect at right angles. If top angle is 90°, what are the other three angles?", options: ["90°, 90°, 90°", "90°, 180°, 90°", "45°, 135°, 90°"], answer: 0},
  {q: getDiagram("58°", "y", "z", "x") + "In the figure, ∠AOC = 58°. What is the sum of adjacent angles ∠AOC and ∠AOD?", options: ["180°", "360°", "90°"], answer: 0}
];

let current = 0, score = 0, currentShuffledOptions = [], correctTextForCurrentQuestion = "";
let clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let correctSound = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");
let wrongSound = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerHTML = "🎉 Quiz Completed! Final Score: " + score + " / " + questions.length;
    return;
  }
  let q = questions[current];
  correctTextForCurrentQuestion = q.options[q.answer];
  currentShuffledOptions = shuffle([...q.options]);

  let html = `<div class="clue-text">Question ${current + 1} of ${questions.length}:</div><div class="target-word">${q.q}</div>`;
  currentShuffledOptions.forEach((opt, index) => { html += `<button onclick="check(${index})">${opt}</button>`; });
  document.getElementById("quiz").innerHTML = html;
}

function check(selectedIndex) {
  clickSound.play().catch(e => {});
  let selectedText = currentShuffledOptions[selectedIndex];
  let buttons = document.querySelectorAll("#quiz button");

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (currentShuffledOptions[idx] === correctTextForCurrentQuestion) btn.style.background = "#a8e6a3";
    if (idx === selectedIndex && selectedText !== correctTextForCurrentQuestion) btn.style.background = "#ffb3b3";
  });

  if (selectedText === correctTextForCurrentQuestion) { score++; correctSound.play().catch(e => {}); }
  else { wrongSound.play().catch(e => {}); }

  document.getElementById("score").innerText = "Score: " + score + " / " + questions.length;
  setTimeout(() => { current++; loadQuestion(); }, 1500);
}
loadQuestion();
</script>
</body>
</html>
